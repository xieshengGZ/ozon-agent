# 线上：docker load 镜像后 docker compose up -d
# 开发：docker build -t ozon-agent:latest . && docker save ozon-agent:latest | gzip > /nas/ozon-agent.tar.gz
services:
  app:
    image: ozon-agent:latest
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1  # 避免在宿主机 app/ 目录下生成 __pycache__
    volumes:
      - ./app:/app/app   # 代码挂载：改代码不用重新 build，Streamlit 会自动检测
      - ./data:/app/data
    restart: unless-stopped
